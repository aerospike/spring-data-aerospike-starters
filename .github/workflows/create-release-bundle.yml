name: Build artifact and create release bundle

permissions:
  id-token: write
  packages: write
  contents: read
  attestations: write

on:
  workflow_call:
    secrets:
      GPG_SECRET_KEY:
        required: true
      GPG_PUBLIC_KEY:
        required: true
      GPG_PASS:
        required: true

jobs:
  extract-version:
    runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Extract Version
        id: extract
        uses: ./.github/actions/get-version
    outputs:
      version: ${{ steps.extract.outputs.release-version }}

  build-sign-deploy:
    needs: extract-version
    uses: aerospike/shared-workflows/.github/workflows/reusable_artifacts-cicd.yaml@b4b1e9dc89314a2d542f9d6fe0ee150ad06f9860 # v5.0.0
    with:
      gh-artifact-directory: build
      gh-workflows-ref: b4b1e9dc89314a2d542f9d6fe0ee150ad06f9860
      jf-build-name: spring-data-aerospike-starters
      jf-project: ${{ vars.JFROG_PROJECT }}
      oidc-audience: ${{ vars.OIDC_AUDIENCE }}
      oidc-provider-name: ${{ vars.OIDC_PROVIDER_NAME }}
      version: ${{ needs.extract-version.outputs.version }}
      jar-group-id: com.aerospike
      setup-java: true
      java-version: 17
      java-distribution: "temurin"
      gh-source-path: spring-data-aerospike-starters
      gh-retention-days: 1
      runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION }}
      build-script: |
        # Maven build
        mvn clean install -B -U -Dgpg.skip=true -DskipTests

        pwd

        LOCAL_REPO=$(mvn help:evaluate -Dexpression=settings.localRepository -q -DforceStdout)
        GROUP_ID=$(mvn help:evaluate -Dexpression=project.groupId -q -DforceStdout)
        VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)

        GROUP_PATH=$(echo "$GROUP_ID" | tr '.' '/')

        EXPECTED_ARTIFACT_IDS=(
          spring-data-aerospike-starters
          spring-boot-autoconfigure-data-aerospike
          spring-boot-starter-aerospike
          spring-boot-starter-aerospike-reactive
          spring-boot-starter-data-aerospike
          spring-boot-starter-data-aerospike-reactive
        )

        MODULE_ARTIFACT_IDS=(
          spring-boot-autoconfigure-data-aerospike
          spring-boot-starter-aerospike
          spring-boot-starter-aerospike-reactive
          spring-boot-starter-data-aerospike
          spring-boot-starter-data-aerospike-reactive
        )

        copy_required_file() {
          local source_file="$1"

          if [[ ! -f "$source_file" ]]; then
            echo "ERROR: Expected Maven artifact file not found: $source_file" >&2
            exit 1
          fi

          cp "$source_file" build/
        }

        copy_maven_artifact() {
          local artifact_id="$1"
          shift
          local artifact_path="$LOCAL_REPO/$GROUP_PATH/$artifact_id/$VERSION"
          local classifier

          echo "Staging Maven artifact: $artifact_id from $artifact_path"

          if [[ ! -d "$artifact_path" ]]; then
            echo "ERROR: Expected Maven artifact directory not found: $artifact_path" >&2
            exit 1
          fi

          copy_required_file "$artifact_path/$artifact_id-$VERSION.pom"

          for classifier in "$@"; do
            copy_required_file "$artifact_path/$artifact_id-$VERSION$classifier.jar"
          done
        }

        echo "Copying expected Maven artifacts to ./build/"

        rm -rf build
        mkdir -p build

        copy_maven_artifact "spring-data-aerospike-starters"

        for artifact_id in "${MODULE_ARTIFACT_IDS[@]}"; do
          copy_maven_artifact "$artifact_id" "" "-sources" "-javadoc"
        done

        mapfile -t copied_poms < <(find build -maxdepth 1 -type f -name "*.pom" -printf "%f\n" | sort)

        expected_pom_names=()
        for artifact_id in "${EXPECTED_ARTIFACT_IDS[@]}"; do
          expected_pom_names+=("$artifact_id-$VERSION.pom")
        done
        mapfile -t expected_poms < <(printf '%s\n' "${expected_pom_names[@]}" | sort)

        if [[ "${copied_poms[*]}" != "${expected_poms[*]}" ]]; then
          echo "ERROR: Staged POM set does not match expected Maven artifacts." >&2
          echo "Expected POMs:" >&2
          printf '  %s\n' "${expected_poms[@]}" >&2
          echo "Copied POMs:" >&2
          printf '  %s\n' "${copied_poms[@]}" >&2
          exit 1
        fi

        example_artifact=$(find build -maxdepth 1 -type f -name "*example*" -print -quit)
        if [[ -n "$example_artifact" ]]; then
          echo "ERROR: Example artifact was staged unexpectedly: $example_artifact" >&2
          exit 1
        fi

        echo "Final staged build artifacts:"
        find build -maxdepth 1 -type f -printf "%f\n" | sort
    secrets:
      gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
      gpg-public-key: ${{ secrets.GPG_PUBLIC_KEY }}
      gpg-key-pass: ${{ secrets.GPG_PASS }}

  create-release-bundle:
    needs: [extract-version, build-sign-deploy]
    uses: aerospike/shared-workflows/.github/workflows/reusable_create-release-bundle.yaml@b4b1e9dc89314a2d542f9d6fe0ee150ad06f9860 # v5.0.0
    with:
      jf-project: ${{ vars.JFROG_PROJECT }}
      jf-build-names: ${{ needs.build-sign-deploy.outputs.jf-build-name }}:${{ needs.build-sign-deploy.outputs.jf-build-id }}
      jf-bundle-name: spring-data-aerospike-starters
      gh-workflows-ref: b4b1e9dc89314a2d542f9d6fe0ee150ad06f9860
      version: ${{ needs.extract-version.outputs.version }}
      oidc-provider-name: ${{ vars.OIDC_PROVIDER_NAME }}
      oidc-audience: ${{ vars.OIDC_AUDIENCE }}
      dry-run: false
      gh-bundle-metadata-artifact-name: bundle-metadata

  promote-to-dev:
    needs: [extract-version, create-release-bundle]
    name: Promote to DEV
    runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Setup JFrog CLI
        uses: step-security/setup-jfrog-cli@53aeacb709fce45d0baf69a13ec3342f7e2d71a9 # v5.1.0
        env:
          JF_URL: ${{ vars.JFROG_PLATFORM_URL }}
          JF_PROJECT: ${{ vars.JFROG_PROJECT }}
        with:
          oidc-provider-name: ${{ vars.OIDC_PROVIDER_NAME }}
          oidc-audience: ${{ vars.OIDC_AUDIENCE }}

      - name: Promoting release bundle to DEV
        uses: aerospike/shared-workflows/.github/actions/promote-release-bundle@b4b1e9dc89314a2d542f9d6fe0ee150ad06f9860 # v5.0.0
        with:
          bundle-name: spring-data-aerospike-starters
          version: ${{ needs.extract-version.outputs.version }}
          environment: DEV
          jf-project: ${{ vars.JFROG_PROJECT }}
